<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activating PDF NEST PRO...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #ffffff;
      color: #111827;
      text-align: center;
    }
    .card {
      border: 1px solid #e5e7eb;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 90%;
    }
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #f59e0b;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      animation: spin 1s linear infinite;
      margin: 20px auto 0;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .status-msg {
      margin-top: 16px;
      font-size: 0.9rem;
      color: #4b5563;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🎉 Payment Confirmed!</h2>
    <p>Activating your PDF NEST PRO plan on this browser...</p>
    <div class="spinner" id="spinner"></div>
    <p class="status-msg" id="status">You can close this window and open the extension.</p>
  </div>

  <script>
    const EXTENSION_ID = "iplnhilfkippechibcffmpgleobedckj";

    function activatePro() {
      if (window.chrome && chrome.runtime && chrome.runtime.sendMessage) {
        chrome.runtime.sendMessage(EXTENSION_ID, { action: "ACTIVATE_PRO_STRIPE" }, (response) => {
          const statusEl = document.getElementById("status");
          const spinnerEl = document.getElementById("spinner");
          
          if (spinnerEl) spinnerEl.style.display = "none";
          if (statusEl) {
            statusEl.innerText = "✨ PRO License successfully activated! Open your PDF NEST extension now.";
            statusEl.style.color = "#10b981";
            statusEl.style.fontWeight = "600";
          }
        });
      }
    }

    window.addEventListener("DOMContentLoaded", activatePro);
  </script>
</body>
</html>
